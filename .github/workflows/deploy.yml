name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch
  workflow_dispatch: # Allows you to trigger the workflow manually

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-cache: "npm" # Speeds up subsequent runs

      - name: Install Dependencies
        run: npm ci # Ensures a clean, reproducible installation

      - name: Type Check & Build Application
        run: |
          npm run tsc || echo "Proceeding despite TS warnings"
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Vite outputs production files here

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
